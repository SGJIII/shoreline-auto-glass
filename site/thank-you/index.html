  <body class="thank-you-page">
    <main class="thanks-shell">
      <a class="thanks-logo" href="/">
        <img src="/assets/logos/shoreline-logo-horizontal.png" alt="Shoreline Auto Glass">

      <section class="thanks-card">

          <button class="button primary" type="submit">Opt in to text updates</button>
        </form>
        <div class="hero-actions">
          <a class="button primary" href="tel:+17745608440">Call (774) 560-8440</a>
